<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <title>PRIA Distance Matrix kaart</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    #app { display: flex; height: 100vh; }
    #left { width: 320px; padding: 12px; box-sizing: border-box; overflow-y: auto; border-right: 1px solid #ddd; }
    #map { flex: 1; }
    .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .row div { font-size: 13px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 4px 6px; font-size: 12px; }
    th { background: #f5f5f5; }
    .btn { margin-top: 10px; padding: 6px 10px; cursor: pointer; }
    #status { margin-top: 6px; font-size: 12px; color: #555; }
  </style>
</head>
<body>

<div id="app">
  <div id="left">
    <h3>PRIA punktid</h3>
    <p style="font-size:13px;">Punktide nimed on fikseeritud. Klõpsa kaardil markerile, et näha vahemaid.</p>

    <div id="rows"></div>

    <button id="load-btn" class="btn">Lae kaardile</button>
    <div id="status"></div>

    <h4 style="margin-top:20px;">Vahemaad</h4>
    <div id="distances-container">
      <p style="font-size:12px;color:#777;">Klõpsa markerile.</p>
    </div>
  </div>

  <div id="map"></div>
</div>

<script>
  // === PRIA punktid ===
  const DEFAULT_POINTS = [
    { name: "REMITK/PRIA",        lat: 58.37324, lng: 26.72591 },
    { name: "REM",                lat: 59.42701, lng: 24.73941 },
    { name: "PRIA Harjumaa",      lat: 59.29974, lng: 24.65540 },
    { name: "PRIA Hiiumaa",       lat: 58.99161, lng: 22.72392 },
    { name: "PRIA Ida-Virumaa",   lat: 59.35515, lng: 27.42315 },
    { name: "PRIA Järvamaa",      lat: 58.88607, lng: 25.55690 },
    { name: "PRIA Jõgevamaa",     lat: 58.74631, lng: 26.39585 },
    { name: "PRIA Lääne-Virumaa", lat: 59.34886, lng: 26.34648 },
    { name: "PRIA Läänemaa",      lat: 58.94888, lng: 23.54242 },
    { name: "PRIA Pärnumaa",      lat: 58.40487, lng: 24.49761 },
    { name: "PRIA Põlvamaa",      lat: 58.05151, lng: 27.05672 },
    { name: "PRIA Raplamaa",      lat: 59.00584, lng: 24.79294 },
    { name: "PRIA Saaremaa",      lat: 58.25434, lng: 22.48521 },
    { name: "PRIA Valgamaa",      lat: 57.77765, lng: 26.03333 },
    { name: "PRIA Viljandimaa",   lat: 58.36322, lng: 25.59472 },
    { name: "PRIA Võrumaa",       lat: 57.84662, lng: 26.99299 }
  ];

  let map;
  let markers = [];
  let points = [];
  let distanceMatrixService;
  let infoWindow;

  // === Kuvame vasakul ainult nimed ===
  function buildNameList() {
    const rowsDiv = document.getElementById("rows");
    DEFAULT_POINTS.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "row";

      const idx = document.createElement("div");
      idx.textContent = i + 1;
      idx.style.width = "20px";

      const name = document.createElement("div");
      name.textContent = p.name;

      row.appendChild(idx);
      row.appendChild(name);
      rowsDiv.appendChild(row);
    });
  }

  // === Punktid tulevad otse DEFAULT_POINTS massiivist ===
  function readPoints() {
    return DEFAULT_POINTS.map((p, idx) => ({
      name: p.name,
      lat: p.lat,
      lng: p.lng,
      index: idx + 1
    }));
  }

  function setStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  function clearMarkers() {
    markers.forEach(m => m.setMap(null));
    markers = [];
  }

  function renderMarkers() {
    clearMarkers();
    const bounds = new google.maps.LatLngBounds();

    points.forEach((p, idx) => {
      const marker = new google.maps.Marker({
        position: { lat: p.lat, lng: p.lng },
        map,
        label: p.name.substring(0, 1)
      });

      marker.addListener("click", () => onMarkerClick(idx));
      markers.push(marker);
      bounds.extend(marker.getPosition());
    });

    map.fitBounds(bounds);
  }

  function onMarkerClick(originIndex) {
    if (!distanceMatrixService) {
      distanceMatrixService = new google.maps.DistanceMatrixService();
    }

    const origin = points[originIndex];
    const origins = [{ lat: origin.lat, lng: origin.lng }];

    const destinations = points
      .filter((_, idx) => idx !== originIndex)
      .map(p => ({ lat: p.lat, lng: p.lng }));

    setStatus("Arvutan vahemaid…");

    distanceMatrixService.getDistanceMatrix(
      {
        origins,
        destinations,
        travelMode: google.maps.TravelMode.DRIVING,
        unitSystem: google.maps.UnitSystem.METRIC
      },
      (response, status) => {
        if (status !== "OK") {
          setStatus("Viga: " + status);
          return;
        }

        setStatus("");

        const results = [];
        const row = response.rows[0];

        row.elements.forEach((el, i) => {
          const dest = points.filter((_, idx) => idx !== originIndex)[i];
          if (el.status === "OK") {
            results.push({
              name: dest.name,
              distanceText: el.distance.text,
              durationText: el.duration.text,
              distanceValue: el.distance.value
            });
          }
        });

        results.sort((a, b) => a.distanceValue - b.distanceValue);

        renderDistancesTable(origin, results);
        showInfoWindow(origin, results);
      }
    );
  }

  function renderDistancesTable(origin, results) {
    const container = document.getElementById("distances-container");

    let html = `<p><b>${origin.name}</b></p>`;
    html += "<table><thead><tr><th>Punkt</th><th>Kaugus</th><th>Aeg</th></tr></thead><tbody>";

    results.forEach(r => {
      html += `<tr>
        <td>${r.name}</td>
        <td>${r.distanceText}</td>
        <td>${r.durationText}</td>
      </tr>`;
    });

    html += "</tbody></table>";
    container.innerHTML = html;
  }

  function showInfoWindow(origin, results) {
    if (!infoWindow) infoWindow = new google.maps.InfoWindow();

    let content = `<div style="font-size:12px;">
      <b>${origin.name}</b>
      <div style="margin-top:6px;"><b>Lähimad punktid:</b></div>
      <ul style="padding-left:16px;">`;

    results.slice(0, 5).forEach(r => {
      content += `<li>${r.name}: ${r.distanceText}, ${r.durationText}</li>`;
    });

    content += "</ul></div>";

    infoWindow.setContent(content);
    infoWindow.open(map, markers[origin.index - 1]);
  }

  function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 58.7, lng: 25.0 },
      zoom: 7
    });
  }

  function loadGoogleMapsScript() {
    const script = document.createElement("script");
    script.src =
      "https://maps.googleapis.com/maps/api/js?key=AIzaSyABR0wozM-Mt2ZCNa1ZAHOKMfD5KFTqOHM&callback=onGoogleMapsLoaded";
    script.async = true;
    script.defer = true;
    document.head.appendChild(script);
  }

  function onGoogleMapsLoaded() {
    initMap();
  }

  window.onGoogleMapsLoaded = onGoogleMapsLoaded;

  document.addEventListener("DOMContentLoaded", () => {
    buildNameList();

    document.getElementById("load-btn").addEventListener("click", () => {
      points = readPoints();
      renderMarkers();
      setStatus("Punktid laetud.");
    });

    loadGoogleMapsScript();
  });
</script>

</body>
</html>
